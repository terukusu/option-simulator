name: calendar-sync

# 取引カレンダー（optionchan の config/trading_calendar.toml）と国民の祝日の一覧（内閣府の CSV）を同期し、
# data/calendar/ に差分があれば固定ブランチ calendar-sync の PR を作る（設計 docs/design.md 7.5）。
# 取得先は secret の OPTIONCHAN_CALENDAR_URL（未設定なら警告だけで成功終了。fork を落とさない）と
# リポジトリ変数 vars.HOLIDAYS_CSV_URL（任意。公的な URL なので変数。未設定なら内閣府の既定の URL）。
# toml の URL は secret なので Actions のログではマスクされ、スクリプトも出力しない（PR 本文にも出ない）。
# URL は使うステップの env にだけ渡す（job の env にするとステップの見出しに値が並ぶ）。
# GITHUB_TOKEN で作った PR には pull_request の CI が走らないので、ci.yml を workflow_dispatch で起動し、
# 必須チェック check を PR の head に付ける。

on:
  schedule:
    - cron: '17 0 * * 1' # 毎週月曜 09:17 JST
  workflow_dispatch:

permissions: {}

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    # 既定ブランチで動いているときだけ。schedule のイベントにはペイロードが無く github.event.repository が空
    # （default_branch との比較が常に偽になり job が skipped になる）。schedule は既定ブランチの最新コミットで
    # しか起動しないので無条件に通し、workflow_dispatch（ペイロードに repository がある）だけ ref を比べる
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # calendar-sync ブランチへの push
      pull-requests: write # 同期 PR の作成・クローズ
      actions: write # ci.yml の workflow_dispatch（同期 PR に check を付ける）
    env:
      # schedule は既定ブランチで動くので github.ref_name = 既定ブランチ（上の if と同じ理由で repository は空）。
      # workflow_dispatch は if で既定ブランチに限っているのでどちらでも同じ値になる
      BASE: ${{ github.event.repository.default_branch || github.ref_name }}
      BRANCH: calendar-sync
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 取得先の確認
        id: guard
        env:
          OPTIONCHAN_CALENDAR_URL: ${{ secrets.OPTIONCHAN_CALENDAR_URL }}
        run: |
          if [ -z "$OPTIONCHAN_CALENDAR_URL" ]; then
            echo "::warning::secret OPTIONCHAN_CALENDAR_URL が未設定のため同期しない（README の「取引カレンダー」）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.skip == 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.skip == 'false'
        with:
          node-version-file: .node-version
          cache: npm
      # 書き込み権限のある job なので依存の install スクリプトを走らせない（同期は Vite の runnerImport で
      # TypeScript を読むだけで、ネイティブのバイナリは optionalDependencies の配布物を使い postinstall は要らない）
      - if: steps.guard.outputs.skip == 'false'
        run: npm ci --ignore-scripts
      - name: 同期（失敗ならジョブが失敗して通知される。何も書かない）
        if: steps.guard.outputs.skip == 'false'
        env:
          OPTIONCHAN_CALENDAR_URL: ${{ secrets.OPTIONCHAN_CALENDAR_URL }}
          HOLIDAYS_CSV_URL: ${{ vars.HOLIDAYS_CSV_URL }}
        run: |
          set -o pipefail
          npm run --silent calendar:sync | tee "$RUNNER_TEMP/sync.txt"
      - name: 同期 PR の作成・更新（差分が無ければ開いている同期 PR を閉じる）
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pr=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number -q '.[0].number')
          if [ -z "$(git status --porcelain -- data/calendar)" ]; then
            echo "data/calendar/ に差分なし"
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch --comment "最新の同期で既定ブランチとの差分が無くなったので閉じる（calendar-sync ワークフロー）"
            fi
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 既定ブランチから作り直す（PR は 1 本に保つ）
          git switch -c "$BRANCH"
          git add data/calendar
          git commit -q -m "chore: 取引カレンダー・祝日の一覧を同期（calendar-sync）"
          # トークンはこの push だけに渡す（.git/config に残さない）
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force origin "HEAD:refs/heads/$BRANCH"
          if [ -z "$pr" ]; then
            {
              echo "定期同期（calendar-sync ワークフロー）が data/calendar/ の差分を見つけた。"
              echo
              echo '```'
              cat "$RUNNER_TEMP/sync.txt"
              echo '```'
              echo
              echo "- 確認: 差分の covered_until・closed_dates・祝日が optionchan の toml・内閣府の公表と合っているか"
              echo "- CI（check）はこのワークフローが workflow_dispatch で起動する。付いていなければ gh workflow run ci.yml --ref $BRANCH"
              echo "- 差分がある間は毎週このブランチを作り直す（PR は 1 本）"
            } > "$RUNNER_TEMP/body.md"
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "chore: 取引カレンダー・祝日の一覧を同期" --body-file "$RUNNER_TEMP/body.md"
          else
            echo "同期 PR #$pr を更新した（force push）"
          fi
          # GITHUB_TOKEN の PR には pull_request の CI が走らないので、check を head に付ける
          gh workflow run ci.yml --ref "$BRANCH"
