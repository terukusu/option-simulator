# main の infra/prod（Cloud Run simulator、#36）を本番へ反映する。
# plan に差分があるときだけ apply job が動き、Environment prod の承認を待つ（差分 0 なら承認待ちを作らない）。
# plan ファイルは artifact で渡さない（公開リポジトリの artifact は誰でも取得でき、state 由来の値を含む）。
# apply は承認後にもう一度 plan して適用する。
# イメージ: タグは入力の git のハッシュ（.github/scripts/image.sh）。Artifact Registry に無ければ apply job が GCP の認証より前に
# ビルド・検査し、認証後に push してから digest で apply する。手順・確認・切り戻しは infra/README.md「prod（Cloud Run simulator）」。
# repository variables が無い（clone して使う人）ときは notice を出して何もしない（main への push を毎回失敗にしない）。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "1"
  # プロジェクト固有の値は repository variables で渡す（infra/README.md「GitHub の設定」）
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  GCP_SA_TF_PLAN: ${{ vars.GCP_SA_TF_PLAN }}
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  # AI の資格情報の種類（none | api_key | oauth_token | wif）と版。秘匿値ではない（値は Secret Manager。infra/README.md「AI の資格情報（Secret Manager）」）。
  # 未設定なら none（AI は無効・環境変数を足さない）と latest
  TF_VAR_ai_credential: ${{ vars.AI_CREDENTIAL || 'none' }}
  TF_VAR_ai_secret_version: ${{ vars.AI_SECRET_VERSION || 'latest' }}
  # Anthropic の WIF（#184。AI_CREDENTIAL=wif のときだけ使う）の ID。秘密ではないが個人の値（echo しない。plan は要約だけを出す）。
  # 未設定は空（infra/README.md「AI の資格情報」の wif）
  TF_VAR_anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
  TF_VAR_anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
  TF_VAR_anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
  TF_VAR_anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
  # 失敗時のログ末尾に使うマスク: Anthropic の WIF の ID（Terraform の変数の検査のエラーの「var.anthropic_* is "…"」・
  # UUID・fdrl_ などの接頭辞の ID。値そのものは mask-wif-ids.sh の ::add-mask:: でも伏せる）、9 桁以上の数字
  # （プロジェクト番号等）と、SA 以外のメールアドレス。ci.yml と deploy.yml で同じ（mask-wif-ids.test.sh が確かめる）
  MASK_SED: >-
    s/(var\.anthropic_[a-z_]+ is )"([^"\\]|\\.)*"/\1"<masked>"/g;
    s/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<uuid>/g;
    s/(fdrl|fdis|svac|wrkspc)_[A-Za-z0-9_-]+/<id>/g;
    s/[0-9]{9,}/<num>/g;
    s/@([A-Za-z0-9-]+)\.iam\.gserviceaccount\.com/__SA__\1__/g;
    s/[A-Za-z0-9._%+-]+@([A-Za-z0-9-]+\.)+[A-Za-z]{2,}/<email>/g;
    s/__SA__([A-Za-z0-9-]+)__/@\1.iam.gserviceaccount.com/g
  # terraform show -json の出力から「アドレス: 操作」と操作ごとの件数だけを Markdown にする（ci.yml の terraform-plan と同じ）
  PLAN_SUMMARY_JQ: |
    def ops:
      (if .change.importing then ["import"] else [] end)
      + (.change.actions
         | if . == ["delete", "create"] or . == ["create", "delete"] then ["replace"]
           elif . == ["no-op"] or . == ["read"] then []
           else . end);
    [.resource_changes[]? | {address, ops: ops} | select(.ops | length > 0)] as $rc
    | if ($rc | length) == 0 then "差分なし（No changes）"
      else
        "| 操作 | 件数 |", "|---|---|",
        ($rc | map(.ops[]) | group_by(.) | map("| \(.[0]) | \(length) |")[]),
        "",
        ($rc[] | "- `\(.address)`: \(.ops | join(", "))")
      end

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      exists: ${{ steps.image.outputs.exists }}
    steps:
      - name: repository variables の確認
        id: vars
        run: |
          for v in GCP_PROJECT_ID TF_STATE_BUCKET GCP_SA_TF_PLAN; do
            if [ -z "${!v}" ]; then
              echo "::notice::repository variable ${v} が未設定なので deploy をスキップ（infra/README.md「GitHub の設定」）"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.vars.outputs.enabled == 'true'
        with:
          persist-credentials: false
      # Anthropic の WIF の ID を以降のログで伏せる（#184。Terraform の検査のエラーは値を表示する）
      - name: WIF の ID をログで伏せる
        if: steps.vars.outputs.enabled == 'true'
        run: .github/scripts/mask-wif-ids.sh
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.vars.outputs.enabled == 'true'
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.vars.outputs.enabled == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_TF_PLAN }}

      # Artifact Registry にあれば digest、無ければタグ参照で plan する（無ければ Cloud Run に差分が出て apply job が動く）
      - name: イメージの解決
        id: image
        if: steps.vars.outputs.enabled == 'true'
        run: .github/scripts/image.sh simulator resolve >> "$GITHUB_OUTPUT"

      - name: terraform plan（prod）
        id: plan
        if: steps.vars.outputs.enabled == 'true'
        working-directory: infra/prod
        env:
          TF_VAR_simulator_image: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_EXISTS: ${{ steps.image.outputs.exists }}
        run: |
          rc=0
          { terraform init -input=false -no-color -backend-config="bucket=${TF_STATE_BUCKET}" \
              && terraform plan -lock=false -input=false -no-color -detailed-exitcode -out=tfplan; } > plan.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "terraform が失敗した（exit $rc）。ログの末尾（マスク済み）:"
            tail -n 40 plan.log | sed -E "$MASK_SED"
            exit "$rc"
          fi
          if [ "$rc" -eq 2 ]; then changes=true; else changes=false; fi
          echo "changes=$changes" >> "$GITHUB_OUTPUT"
          {
            echo "### terraform plan（infra/prod、${GITHUB_SHA}）"
            echo
            terraform show -json tfplan | jq -r "$PLAN_SUMMARY_JQ"
            echo
            if [ "$IMAGE_EXISTS" = true ]; then
              echo "- イメージ simulator: \`${IMAGE_TAG}\` は既存"
            else
              echo "- イメージ simulator: \`${IMAGE_TAG}\` は未作成（apply job がビルド・push する）"
            fi
            echo
            if [ "$changes" = true ]; then
              echo "差分あり: apply job が Environment prod の承認を待つ。"
            else
              echo "差分なし: apply は行わない。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Environment prod（main だけ・所有者の承認）の job だけが apply SA を借用できる（infra/bootstrap の WIF の subject）
  apply:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Anthropic の WIF の ID を以降のログで伏せる（#184。Terraform の検査のエラーは値を表示する）
      - name: WIF の ID をログで伏せる
        run: .github/scripts/mask-wif-ids.sh

      # ビルドは GCP の認証より前に行う（依存の取得中に資格情報ファイルが無いように）。検査は ci.yml の check と同じ
      - name: イメージのビルドと検査（未作成のときだけ）
        if: needs.plan.outputs.exists != 'true'
        run: |
          docker build -t simulator:build .
          .github/scripts/image-check.sh simulator:build

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_TF_APPLY }}

      # 承認待ちの間に別の run が push した場合に備えてもう一度確かめる。タグは不変（immutable_tags）なので二重 push は失敗で止まる
      - name: イメージの push と digest の解決
        id: image
        env:
          BUILT: ${{ needs.plan.outputs.exists != 'true' }}
        run: |
          script=.github/scripts/image.sh
          resolved=$("$script" simulator resolve)
          if grep -qx 'exists=false' <<<"$resolved"; then
            if [ "$BUILT" != true ]; then
              echo "イメージが Artifact Registry に無いが、この job ではビルドしていない（plan の後に消えた可能性）。deploy をやり直す。"
              exit 1
            fi
            ref=$(sed -n 's/^image=//p' <<<"$resolved")
            # 出力は認証中のアカウント名を含みうるのでマスクを通す（pipefail で失敗は伝わる）
            gcloud auth configure-docker "${GCP_REGION:-asia-northeast1}-docker.pkg.dev" --quiet 2>&1 | sed -E "$MASK_SED"
            docker tag simulator:build "$ref"
            docker push --quiet "$ref" 2>&1 | sed -E "$MASK_SED"
            resolved=$("$script" simulator resolve)
          fi
          image=$(sed -n 's/^image=//p' <<<"$resolved")
          tag=$(sed -n 's/^tag=//p' <<<"$resolved")
          if [[ "$image" != *@sha256:* ]]; then
            echo "digest が得られない: ${image}"
            exit 1
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          digest=${image##*@sha256:}
          echo "イメージ simulator: \`${tag}\`（digest \`sha256:${digest:0:12}\`）" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: terraform apply（prod）
        working-directory: infra/prod
        env:
          TF_VAR_simulator_image: ${{ steps.image.outputs.image }}
        run: |
          # Cloud Run には digest でだけデプロイする
          if [[ "$TF_VAR_simulator_image" != *@sha256:* ]]; then
            echo "TF_VAR_simulator_image が digest 参照でない"
            exit 1
          fi
          rc=0
          { terraform init -input=false -no-color -backend-config="bucket=${TF_STATE_BUCKET}" \
              && terraform apply -auto-approve -input=false -no-color; } > apply.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "terraform apply が失敗した（exit $rc）。ログの末尾（マスク済み）:"
            tail -n 40 apply.log | sed -E "$MASK_SED"
            exit "$rc"
          fi
          grep -E '^Apply complete!' apply.log | tee -a "$GITHUB_STEP_SUMMARY"
