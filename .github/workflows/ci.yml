name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 定期同期（calendar-sync.yml）の PR に check を付けるため（GITHUB_TOKEN の PR では pull_request が走らない）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: 合成の板 JSON が生成器の出力と一致するか
        run: npm run fixtures:check
      - run: npm test
        env:
          # 性能テスト（AC8 の計算部分）は CI では緩い閾値にする
          PERF_BUDGET_MS: '200'
      - run: npm run build
      - name: ビルド成果物の検査（CSP。インライン script・style 属性・外部 URL を拒否）
        run: |
          set -eu
          f=dist/index.html
          # src の無い <script>（インライン）と <style> 要素
          if grep -n '<script' "$f" | grep -v 'src='; then echo "インライン script がある: $f"; exit 1; fi
          if grep -n '<style' "$f"; then echo "style 要素がある: $f"; exit 1; fi
          if grep -nE '[[:space:]]style=' "$f"; then echo "style 属性がある: $f"; exit 1; fi
          if grep -nE 'https?://' "$f"; then echo "外部 URL がある: $f"; exit 1; fi
          echo "ok: $f"
