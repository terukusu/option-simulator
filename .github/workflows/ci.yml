name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # イメージのビルド・検査（#36）で数分延びる
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 個人の値の検査（docs/design.md 2.2 AC12、#40）。出力はファイル名・行番号・検査名だけ（値・行の中身は出さない）。
      # 公開リポジトリの Actions のログに repository variables の値は伏せられずに出るので、ここでは vars を渡さない:
      # オーナー名（URL で公開済み）と、secret の WIF プロバイダから取ったプロジェクト番号（マスクする）だけ。
      # プロジェクト ID の値の検査は terraform-plan job（同じリポジトリの PR だけ）。fork の PR では番号の検査は飛ぶ
      - name: 個人の値の検査のテスト
        run: .github/scripts/repo-values-check.test.sh
      - name: WIF の ID のマスクのテスト
        run: .github/scripts/mask-wif-ids.test.sh
      - name: 個人の値の検査（形・オーナー名・プロジェクト番号）
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          set -eu
          GCP_PROJECT_NUMBER=$(printf '%s' "$GCP_WIF_PROVIDER" | sed -nE 's#^projects/([0-9]+)/.*#\1#p')
          if [ -n "$GCP_PROJECT_NUMBER" ]; then echo "::add-mask::$GCP_PROJECT_NUMBER"; fi
          export GCP_PROJECT_NUMBER
          .github/scripts/repo-values-check.sh .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: 合成の板 JSON が生成器の出力と一致するか
        run: npm run fixtures:check
      - run: npm test
        env:
          # 性能テスト（AC8 の計算部分）は CI では緩い閾値にする
          PERF_BUDGET_MS: '200'
      - run: npm run build
      - name: ビルド成果物の検査（CSP。インライン script・style 属性・外部 URL を拒否）
        # 検査の中身は .github/scripts/csp-check.sh（イメージに同梱した index.html にも同じ検査をする。#36）
        run: .github/scripts/csp-check.sh dist/index.html
      # API（api/、#33）。Python 3.13 と uv.lock（uv は pip で固定版を入れる。optionchan の CI と同じ流儀）
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: API の依存
        working-directory: api
        run: |
          python -m pip install uv==0.12.19
          uv sync --locked --python 3.13
      - name: API の lint
        working-directory: api
        run: uv run --locked ruff check
      - name: API のテスト
        working-directory: api
        run: uv run --locked pytest -q
      # optionchan との契約（AC25）: API が宣言した列（api/src/simulator_api/contract.py）を optionchan の固定コミット
      # （api/contract/optionchan_commit.txt）の schema/tokyo・schema/cm と照合する。リポジトリ名はリポジトリ変数 OPTIONCHAN_REPO
      # （<OWNER>/<REPO>）で渡し、未設定（fork・clone）なら notice を出してスキップする
      - name: optionchan の固定コミット
        id: optionchan
        env:
          OPTIONCHAN_REPO: ${{ vars.OPTIONCHAN_REPO }}
        run: |
          set -eu
          sha=$(cat api/contract/optionchan_commit.txt)
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then echo "api/contract/optionchan_commit.txt が 40 桁の SHA でない"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -z "$OPTIONCHAN_REPO" ]; then
            echo "::notice::リポジトリ変数 OPTIONCHAN_REPO が未設定なので optionchan との契約の照合をスキップ"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.optionchan.outputs.enabled == 'true'
        with:
          repository: ${{ vars.OPTIONCHAN_REPO }}
          ref: ${{ steps.optionchan.outputs.sha }}
          path: .optionchan
          sparse-checkout: |
            schema/tokyo
            schema/cm
          persist-credentials: false
      - name: optionchan との契約の照合
        if: steps.optionchan.outputs.enabled == 'true'
        working-directory: api
        env:
          OPTIONCHAN_SCHEMA_DIR: ${{ github.workspace }}/.optionchan/schema
        run: uv run --locked pytest -q -rs tests/test_contract.py
      # Terraform（infra/、#35・#36）。資格情報なし: fmt・validate と、モックのプロバイダの terraform test だけ
      # （prod の plan は下の terraform-plan job と deploy.yml。bootstrap の plan は infra/README.md）
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate（bootstrap）
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false -no-color
          terraform -chdir=infra/bootstrap validate -no-color
      - name: terraform test（bootstrap、モックのプロバイダ）
        run: terraform -chdir=infra/bootstrap test -no-color
      - name: terraform validate（prod）
        run: |
          terraform -chdir=infra/prod init -backend=false -input=false -no-color
          terraform -chdir=infra/prod validate -no-color
      - name: terraform test（prod、モックのプロバイダ）
        run: terraform -chdir=infra/prod test -no-color
      # Cloud Run simulator のイメージ（#36）。GCP の認証は使わない（push は deploy.yml の承認後の apply job）
      - name: イメージの入力と .dockerignore の一致
        run: |
          set -euo pipefail
          # .dockerignore の許可リスト（! の行。末尾の / を除く）+ Dockerfile・.dockerignore = image.sh の入力パス
          diff <(.github/scripts/image.sh simulator paths | sort) \
            <({ sed -n 's/^!\(.*\)$/\1/p' .dockerignore | sed 's:/$::'; printf '%s\n' Dockerfile .dockerignore; } | sort)
          echo "タグ: $(.github/scripts/image.sh simulator tag)"
      - name: イメージのビルド
        run: docker build -t simulator:ci .
      - name: イメージの検査（import・非 root・除外物・同梱の index.html の CSP・/healthz・/・/assets の 200 と CSP ヘッダ）
        run: .github/scripts/image-check.sh simulator:ci

  # PR の infra/prod の plan（#36）。同じリポジトリのブランチの PR だけ（fork の PR には資格情報を渡さない。fork の PR に資格情報が渡るトリガーは使わない）。
  # 必須 check にはしない（ブランチ保護の必須は check だけ）。公開リポジトリなので、plan の全文・plan ファイルは出さず、
  # 要約（アドレスと操作・件数）を step summary にだけ書く。repository variables が無い（clone して使う人）ときは notice を出して何もしない
  terraform-plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: "1"
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      GCP_SA_TF_PLAN: ${{ vars.GCP_SA_TF_PLAN }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      # AI の資格情報の種類（none | api_key | oauth_token | wif）と版。秘匿値ではない（値は Secret Manager。infra/README.md「AI の資格情報（Secret Manager）」）。
      # 未設定なら none（AI は無効・環境変数を足さない）と latest
      TF_VAR_ai_credential: ${{ vars.AI_CREDENTIAL || 'none' }}
      TF_VAR_ai_secret_version: ${{ vars.AI_SECRET_VERSION || 'latest' }}
      # Anthropic の WIF（#184。AI_CREDENTIAL=wif のときだけ使う）の ID。秘密ではないが個人の値（echo しない。plan は要約だけを出す）。
      # 未設定は空（infra/README.md「AI の資格情報」の wif）
      TF_VAR_anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      TF_VAR_anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      TF_VAR_anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      TF_VAR_anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      # 失敗時のログ末尾に使うマスク: Anthropic の WIF の ID（Terraform の変数の検査のエラーの「var.anthropic_* is "…"」・
      # UUID・fdrl_ などの接頭辞の ID。値そのものは mask-wif-ids.sh の ::add-mask:: でも伏せる）、9 桁以上の数字
      # （プロジェクト番号等）と、SA 以外のメールアドレス。ci.yml と deploy.yml で同じ（mask-wif-ids.test.sh が確かめる）
      MASK_SED: >-
        s/(var\.anthropic_[a-z_]+ is )"([^"\\]|\\.)*"/\1"<masked>"/g;
        s/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<uuid>/g;
        s/(fdrl|fdis|svac|wrkspc)_[A-Za-z0-9_-]+/<id>/g;
        s/[0-9]{9,}/<num>/g;
        s/@([A-Za-z0-9-]+)\.iam\.gserviceaccount\.com/__SA__\1__/g;
        s/[A-Za-z0-9._%+-]+@([A-Za-z0-9-]+\.)+[A-Za-z]{2,}/<email>/g;
        s/__SA__([A-Za-z0-9-]+)__/@\1.iam.gserviceaccount.com/g
      # terraform show -json の出力から「アドレス: 操作」と操作ごとの件数だけを Markdown にする（deploy.yml と同じ）
      PLAN_SUMMARY_JQ: |
        def ops:
          (if .change.importing then ["import"] else [] end)
          + (.change.actions
             | if . == ["delete", "create"] or . == ["create", "delete"] then ["replace"]
               elif . == ["no-op"] or . == ["read"] then []
               else . end);
        [.resource_changes[]? | {address, ops: ops} | select(.ops | length > 0)] as $rc
        | if ($rc | length) == 0 then "差分なし（No changes）"
          else
            "| 操作 | 件数 |", "|---|---|",
            ($rc | map(.ops[]) | group_by(.) | map("| \(.[0]) | \(length) |")[]),
            "",
            ($rc[] | "- `\(.address)`: \(.ops | join(", "))")
          end
    steps:
      - name: repository variables の確認
        id: vars
        run: |
          for v in GCP_PROJECT_ID TF_STATE_BUCKET GCP_SA_TF_PLAN; do
            if [ -z "${!v}" ]; then
              echo "::notice::repository variable ${v} が未設定なので infra/prod の plan をスキップ（infra/README.md「GitHub の設定」）"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.vars.outputs.enabled == 'true'
        with:
          persist-credentials: false
      # Anthropic の WIF の ID を以降のログで伏せる（#184。Terraform の検査のエラーは値を表示する）
      - name: WIF の ID をログで伏せる
        if: steps.vars.outputs.enabled == 'true'
        run: .github/scripts/mask-wif-ids.sh
      # 個人の値の検査のうちプロジェクト ID の値（#40）。GCP_PROJECT_ID は job の env にあるものを使う
      # （check job に vars を渡してログの露出を増やさない）。出力はファイル名・行番号・検査名だけ
      - name: 個人の値の検査（プロジェクト ID）
        if: steps.vars.outputs.enabled == 'true'
        run: .github/scripts/repo-values-check.sh .
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.vars.outputs.enabled == 'true'
        with:
          terraform_version: 1.16.4
          # wrapper は stdout を step 出力に載せるので使わない
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.vars.outputs.enabled == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_TF_PLAN }}
      # Artifact Registry にあれば digest、無ければタグ参照で plan する（ビルド・push はマージ後に承認された apply job）
      - name: イメージの解決
        id: image
        if: steps.vars.outputs.enabled == 'true'
        run: .github/scripts/image.sh simulator resolve >> "$GITHUB_OUTPUT"
      - name: terraform plan（prod）
        if: steps.vars.outputs.enabled == 'true'
        working-directory: infra/prod
        env:
          TF_VAR_simulator_image: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_EXISTS: ${{ steps.image.outputs.exists }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rc=0
          { terraform init -input=false -no-color -backend-config="bucket=${TF_STATE_BUCKET}" \
              && terraform plan -lock=false -input=false -no-color -out=tfplan; } > plan.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "terraform が失敗した（exit $rc）。ログの末尾（マスク済み）:"
            tail -n 40 plan.log | sed -E "$MASK_SED"
            exit "$rc"
          fi
          {
            echo "### terraform plan（infra/prod）"
            echo
            terraform show -json tfplan | jq -r "$PLAN_SUMMARY_JQ"
            echo
            if [ "$IMAGE_EXISTS" = true ]; then
              digest=${TF_VAR_simulator_image##*@sha256:}
              echo "- イメージ simulator: \`${IMAGE_TAG}\` は既存（digest \`sha256:${digest:0:12}\` で plan）"
            else
              echo "- イメージ simulator: \`${IMAGE_TAG}\` は未作成（マージ後、承認された apply job がビルド・push してから digest で apply する）"
            fi
            echo
            echo "対象コミット: ${HEAD_SHA}（全文は公開しない。アドレスと操作のみ）"
          } >> "$GITHUB_STEP_SUMMARY"
