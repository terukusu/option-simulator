name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 定期同期（calendar-sync.yml）の PR に check を付けるため（GITHUB_TOKEN の PR では pull_request が走らない）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: 合成の板 JSON が生成器の出力と一致するか
        run: npm run fixtures:check
      - run: npm test
        env:
          # 性能テスト（AC8 の計算部分）は CI では緩い閾値にする
          PERF_BUDGET_MS: '200'
      - run: npm run build
      - name: ビルド成果物の検査（CSP。インライン script・style 属性・外部 URL を拒否）
        run: |
          set -eu
          f=dist/index.html
          # src の無い <script>（インライン）と <style> 要素
          if grep -n '<script' "$f" | grep -v 'src='; then echo "インライン script がある: $f"; exit 1; fi
          if grep -n '<style' "$f"; then echo "style 要素がある: $f"; exit 1; fi
          if grep -nE '[[:space:]]style=' "$f"; then echo "style 属性がある: $f"; exit 1; fi
          if grep -nE 'https?://' "$f"; then echo "外部 URL がある: $f"; exit 1; fi
          echo "ok: $f"
      # API（api/、#33）。Python 3.13 と uv.lock（uv は pip で固定版を入れる。optionchan の CI と同じ流儀）
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: API の依存
        working-directory: api
        run: |
          python -m pip install uv==0.12.19
          uv sync --locked --python 3.13
      - name: API の lint
        working-directory: api
        run: uv run --locked ruff check
      - name: API のテスト
        working-directory: api
        run: uv run --locked pytest -q
      # optionchan との契約（AC25）: API が宣言した列（api/src/simulator_api/contract.py）を optionchan の固定コミット
      # （api/contract/optionchan_commit.txt）の schema/tokyo と照合する。リポジトリ名はリポジトリ変数 OPTIONCHAN_REPO
      # （<OWNER>/<REPO>）で渡し、未設定（fork・clone）なら notice を出してスキップする
      - name: optionchan の固定コミット
        id: optionchan
        env:
          OPTIONCHAN_REPO: ${{ vars.OPTIONCHAN_REPO }}
        run: |
          set -eu
          sha=$(cat api/contract/optionchan_commit.txt)
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then echo "api/contract/optionchan_commit.txt が 40 桁の SHA でない"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -z "$OPTIONCHAN_REPO" ]; then
            echo "::notice::リポジトリ変数 OPTIONCHAN_REPO が未設定なので optionchan との契約の照合をスキップ"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.optionchan.outputs.enabled == 'true'
        with:
          repository: ${{ vars.OPTIONCHAN_REPO }}
          ref: ${{ steps.optionchan.outputs.sha }}
          path: .optionchan
          sparse-checkout: schema/tokyo
          persist-credentials: false
      - name: optionchan との契約の照合
        if: steps.optionchan.outputs.enabled == 'true'
        working-directory: api
        env:
          OPTIONCHAN_SCHEMA_DIR: ${{ github.workspace }}/.optionchan/schema/tokyo
        run: uv run --locked pytest -q -rs tests/test_contract.py
      # Terraform（infra/、#35）。資格情報なし: fmt・validate と、モックのプロバイダの terraform test だけ（plan は infra/README.md）
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate（bootstrap）
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false -no-color
          terraform -chdir=infra/bootstrap validate -no-color
      - name: terraform test（bootstrap、モックのプロバイダ）
        run: terraform -chdir=infra/bootstrap test -no-color
