<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OP Simulator — UI 再設計 試作品</title>
<meta name="description" content="日経225オプションの戦略検討ツールの UI 再設計の試作品。値はすべて架空。">
<style>
/* ===== tokens ===== */
:root {
  color-scheme: dark;
  --bg: #0e1116;
  --s1: #151921;
  --s2: #1b2029;
  --s3: #232a36;
  --s4: #2b3340;
  --line: #262d3a;
  --line-2: #3a4455;
  --ink: #e6e9ef;
  --ink-2: #a3acbb;
  --ink-3: #6b7484;
  --accent: #3987e5;
  --accent-ink: #9cc4f5;
  --accent-fill: rgba(57, 135, 229, 0.16);
  --handle: #d95926;
  --handle-fill: rgba(217, 89, 38, 0.22);
  --expiry: #e6e9ef;
  --today: #8b94a5;
  --pin1: #199e70;
  --pin2: #9085e9;
  --pin3: #d55181;
  --gain: #2fb483;
  --loss: #ef6b6b;
  --warn: #d9962a;
  --gain-fill: rgba(47, 180, 131, 0.14);
  --loss-fill: rgba(239, 107, 107, 0.16);
  --bid: #55c796;
  --ask: #ef8585;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  --font: "Inter", "Hiragino Sans", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --r: 10px;
  --r-sm: 6px;
  --top-h: 48px;
  --dock-h: 56px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef0f3;
  --s1: #ffffff;
  --s2: #f6f7f9;
  --s3: #eceef2;
  --s4: #e1e4ea;
  --line: #dde1e7;
  --line-2: #c4cad4;
  --ink: #12161c;
  --ink-2: #4f5867;
  --ink-3: #8b94a3;
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --accent-fill: rgba(42, 120, 214, 0.14);
  --handle: #e05a1f;
  --handle-fill: rgba(235, 104, 52, 0.2);
  --expiry: #12161c;
  --today: #6b7380;
  --pin1: #1baf7a;
  --pin2: #6250d6;
  --pin3: #d8578a;
  --gain: #0f8a5c;
  --loss: #d13f3f;
  --warn: #a86b00;
  --gain-fill: rgba(27, 175, 122, 0.14);
  --loss-fill: rgba(227, 73, 72, 0.14);
  --bid: #0f8a5c;
  --ask: #d13f3f;
  --shadow: 0 12px 40px rgba(20, 30, 50, 0.18);
}

/* ===== base ===== */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.gain { color: var(--gain); }
.loss { color: var(--loss); }
.warn { color: var(--warn); }
.nowrap { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
[hidden] { display: none !important; }

/* ===== controls ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 12px;
  border: 1px solid var(--line-2); border-radius: var(--r-sm);
  background: var(--s2); color: var(--ink);
  white-space: nowrap; user-select: none;
}
.btn:hover { background: var(--s3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--s3); color: var(--ink); }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12px; }
.btn:disabled { opacity: 0.4; cursor: default; }

.seg {
  display: inline-flex; background: var(--s3); border-radius: var(--r-sm); padding: 2px; gap: 2px;
  white-space: nowrap; flex: 0 0 auto;
}
.seg > button {
  border: 0; background: transparent; color: var(--ink-2);
  height: 26px; padding: 0 10px; border-radius: 5px; font-size: 12.5px; white-space: nowrap;
}
.seg > button[aria-pressed="true"], .seg > button[aria-selected="true"] { background: var(--s1); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.25); }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  height: 28px; padding: 0 10px; border-radius: 999px;
  border: 1px solid var(--line-2); background: transparent; color: var(--ink-2);
  font-size: 12.5px; white-space: nowrap; flex: 0 0 auto;
}
.chip:hover { color: var(--ink); background: var(--s3); }
.chip[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent); color: var(--accent-ink); }
.chip.warnchip[aria-pressed="true"] { background: rgba(217,150,42,.15); border-color: var(--warn); color: var(--warn); }
.chiprow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chiprow::-webkit-scrollbar { display: none; }

.stepper {
  display: inline-grid; grid-template-columns: 28px 1fr 28px; align-items: center;
  height: 36px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--s2);
  min-width: 0; user-select: none; touch-action: none;
}
.stepper > button { border: 0; background: transparent; height: 100%; color: var(--ink-2); font-size: 16px; }
.stepper > button:hover { color: var(--ink); background: var(--s3); }
.stepper > .val { text-align: center; cursor: ew-resize; display: flex; flex-direction: column; line-height: 1.05; padding: 0 4px; min-width: 0; }
.stepper > .val b { font-weight: 600; font-size: 14px; white-space: nowrap; }
.stepper > .val small { font-size: 10px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper.hot > .val b { color: var(--accent-ink); }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.input {
  height: 32px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: var(--r-sm);
  background: var(--s1); color: var(--ink); min-width: 0; width: 100%;
}
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

.tag {
  display: inline-block; font-size: 10.5px; line-height: 16px; padding: 0 6px; border-radius: 4px;
  background: var(--s3); color: var(--ink-2); white-space: nowrap;
}
.tag.warn { background: rgba(217,150,42,.15); color: var(--warn); }
.tag.ok { background: var(--gain-fill); color: var(--gain); }
.tag.bad { background: var(--loss-fill); color: var(--loss); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gain); }
.dot.warn { background: var(--warn); }

.kbd {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; line-height: 16px;
}

/* ===== top bar ===== */
.top {
  height: var(--top-h); display: flex; align-items: center; gap: 10px;
  padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--s1);
}
.top .brand { font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.top .brand small { color: var(--ink-3); font-weight: 500; margin-left: 4px; }
.boxtabs { display: flex; gap: 4px; align-items: center; flex: 0 1 auto; min-width: 0; overflow: hidden; }
.boxtab {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
  border-radius: var(--r-sm); border: 1px solid transparent; background: transparent; color: var(--ink-2);
  max-width: 9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.boxtab[aria-selected="true"] { background: var(--s3); color: var(--ink); border-color: var(--line-2); }
.boxtab .n { font-size: 11px; color: var(--ink-3); background: var(--s4); border-radius: 999px; padding: 0 6px; line-height: 16px; }
.boxtab[aria-selected="true"] .n { color: var(--ink-2); }
.market-pill {
  margin-left: auto; display: inline-flex; align-items: center; gap: 8px;
  height: 30px; padding: 0 10px; border-radius: 999px; background: var(--s2); border: 1px solid var(--line);
  color: var(--ink-2); font-size: 12.5px; white-space: nowrap; min-width: 0; overflow: hidden;
}
.market-pill b { color: var(--ink); font-weight: 600; }
.market-pill .ellip { overflow: hidden; text-overflow: ellipsis; }

/* ===== layout ===== */
.layout {
  height: calc(100dvh - var(--top-h));
  display: grid;
  min-height: 0;
}
section.panel { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.panel-head {
  display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px;
  border-bottom: 1px solid var(--line); flex: 0 0 auto;
}
.panel-head h2 { font-size: 13px; font-weight: 600; margin: 0; white-space: nowrap; }
.panel-head .sub { color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.panel-head .spacer { flex: 1; }
.panel-body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }

/* --- stage --- */
.stage { background: var(--s1); position: relative; display: flex; flex-direction: column; min-height: 0; container-type: inline-size; }
.stage-head { display: flex; align-items: center; gap: 8px; padding: 6px 12px 0; flex: 0 0 auto; min-width: 0; }
.legend { display: flex; gap: 10px; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; }
.legend i.exp { border-color: var(--expiry); }
.legend i.sc { border-color: var(--accent); }
.legend i.td { border-color: var(--today); border-top-style: dashed; }
.legend i.p1 { border-color: var(--pin1); border-top-style: dashed; }
.legend i.p2 { border-color: var(--pin2); border-top-style: dotted; }
.legend i.p3 { border-color: var(--pin3); border-top-style: dashed; }
.legend i.heat { width: 40px; height: 8px; border: 0; border-radius: 2px; background: linear-gradient(90deg, var(--loss), var(--s1), var(--gain)); }
.stage-tools { margin-left: auto; display: flex; gap: 4px; align-items: center; flex: 0 0 auto; }

.stage-body { flex: 1; min-height: 120px; display: grid; grid-template-columns: 1fr 34px; position: relative; }
.chart { position: relative; min-width: 0; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; outline: none; }
.chart:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); border-radius: 6px; }
.chart svg, .chart canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.chart.grabbing { cursor: grabbing; }
.chart.hover-handle { cursor: ew-resize; }
.chart .ax text { fill: var(--ink-3); font-size: 10.5px; font-family: var(--mono); }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--line-2); stroke-width: 1; }
.chart .l-exp { fill: none; stroke: var(--expiry); stroke-width: 2; stroke-linejoin: round; }
.chart .l-sc { fill: none; stroke: var(--accent); stroke-width: 2.25; }
.chart .l-td { fill: none; stroke: var(--today); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .l-pin { fill: none; stroke-width: 1.75; }
.chart .fill-gain { fill: var(--gain-fill); }
.chart .fill-loss { fill: var(--loss-fill); }
.chart .vline { stroke: var(--handle); stroke-width: 1.25; stroke-dasharray: 3 3; }
.chart .x0 { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .atm2 { stroke: var(--pin2); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .handle { fill: var(--handle); stroke: var(--s1); stroke-width: 2; }
.chart .handle-ring { fill: none; stroke: var(--handle); stroke-width: 1.25; opacity: .55; }
.chart .grip { fill: var(--handle); }
.chart .xpt circle { stroke: var(--s1); stroke-width: 1.5; }
.chart .xpt text { font-size: 11px; font-family: var(--mono); font-weight: 600; paint-order: stroke; stroke: var(--s1); stroke-width: 3px; stroke-linejoin: round; }
.chart .xpt .exp { fill: var(--expiry); }
.chart .xpt .sc { fill: var(--accent); }
.chart .xpt .td { fill: var(--today); }
.chart .bep { fill: var(--s1); stroke: var(--expiry); stroke-width: 1.5; }
.chart .legmark { fill: var(--ink-2); }
.chart .legmark.sell { fill: var(--s1); stroke: var(--ink-2); stroke-width: 1.5; }
.chart .legmark.sel { fill: var(--handle); stroke: var(--handle); }
.chart .legtxt { fill: var(--ink-3); font-size: 10px; font-family: var(--mono); }
.chart .pinlbl { font-size: 11px; font-family: var(--mono); font-weight: 600; paint-order: stroke; stroke: var(--s1); stroke-width: 3px; }
.chart .cross { stroke: var(--ink); stroke-width: 1; opacity: .8; }
.chart .empty { fill: var(--ink-3); font-size: 13px; }

.ivrail { position: relative; border-left: 1px solid var(--line); touch-action: none; user-select: none; display: flex; flex-direction: column; align-items: center; }
.ivrail .track { position: absolute; left: 50%; top: 22px; bottom: 22px; width: 2px; background: var(--line-2); transform: translateX(-50%); border-radius: 2px; }
.ivrail .zero { position: absolute; left: 8px; right: 8px; height: 1px; background: var(--ink-3); }
.ivrail .knob { position: absolute; left: 50%; width: 20px; height: 20px; border-radius: 50%; background: var(--s1); border: 2px solid var(--accent); transform: translate(-50%, -50%); cursor: ns-resize; }
.ivrail .knob::after { content: ""; position: absolute; inset: -10px; }
.ivrail .lbl { position: absolute; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--ink-3); font-family: var(--mono); }
.ivrail .lbl.top { top: 4px; } .ivrail .lbl.bot { bottom: 4px; }
.ivrail .cur { position: absolute; right: 36px; transform: translateY(-50%); font-size: 11px; font-family: var(--mono); background: var(--s3); border-radius: 4px; padding: 1px 5px; color: var(--accent-ink); white-space: nowrap; pointer-events: none; }
.ivrail.hot .knob { background: var(--accent); }

/* time rail */
.timerail { height: 44px; position: relative; margin: 0 12px; touch-action: none; user-select: none; flex: 0 0 auto; }
.timerail .track { position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 3px; background: var(--s3); }
.timerail .fillbar { position: absolute; left: 0; top: 14px; height: 6px; border-radius: 3px; background: var(--accent); opacity: .7; }
.timerail .mark { position: absolute; top: 10px; width: 2px; height: 14px; background: var(--ink-3); transform: translateX(-50%); }
.timerail .mark.sq { background: var(--ink-2); }
.timerail .mtxt { position: absolute; top: 26px; transform: translateX(-50%); font-size: 10px; color: var(--ink-3); white-space: nowrap; font-family: var(--mono); }
.timerail .mtxt.right { transform: translateX(-100%); }
.timerail .mtxt.left { transform: none; }
.timerail .knob { position: absolute; top: 17px; width: 22px; height: 22px; border-radius: 50%; background: var(--s1); border: 2px solid var(--accent); transform: translate(-50%, -50%); cursor: ew-resize; z-index: 2; }
.timerail .knob::after { content: ""; position: absolute; inset: -10px; }
.timerail.hot .knob { background: var(--accent); }
.timerail .cur { position: absolute; top: -2px; transform: translate(-50%, -100%); font-size: 11px; font-family: var(--mono); color: var(--accent-ink); background: var(--s3); border-radius: 4px; padding: 1px 6px; white-space: nowrap; pointer-events: none; }

/* readout */
.readout {
  display: grid; grid-auto-flow: column; grid-template-columns: minmax(0, 1.6fr); grid-auto-columns: minmax(0, 1fr); gap: 8px;
  padding: 8px 12px 10px; border-top: 1px solid var(--line); flex: 0 0 auto; min-width: 0;
}
.ro { min-width: 0; }
.ro .k { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .02em; }
.ro .v { font-family: var(--mono); font-size: 18px; font-weight: 600; white-space: nowrap; line-height: 1.15; font-variant-numeric: tabular-nums; }
.ro .v small { font-size: 11px; color: var(--ink-3); font-weight: 500; margin-left: 2px; }
.ro.hero .v { font-size: 26px; }
.ro .s { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }
.ro.sc .k { color: var(--accent-ink); }


/* scenario bar / panel */
.scenario { background: var(--s1); border-top: 1px solid var(--line); container-type: inline-size; }
.scn-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding: 10px 12px; }
.scn-row { display: flex; gap: 6px; align-items: center; padding: 0 12px 10px; min-width: 0; }
.scn-row .chiprow { flex: 1; min-width: 0; }
.scn-row .right { margin-left: auto; display: flex; gap: 6px; flex: 0 0 auto; }
details.adv { border-top: 1px solid var(--line); }
details.adv summary { padding: 8px 12px; font-size: 12px; color: var(--ink-2); cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
details.adv summary::before { content: "▸"; color: var(--ink-3); }
details.adv[open] summary::before { content: "▾"; }
details.adv summary .vals { color: var(--ink-3); font-family: var(--mono); font-size: 11px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adv-body { display: flex; flex-wrap: wrap; gap: 10px 18px; padding: 0 12px 12px; align-items: center; }
.adv-body .lab { font-size: 11px; color: var(--ink-3); margin-right: 6px; }
.adv-body .item { display: inline-flex; align-items: center; gap: 6px; }

/* --- market (board / smile) --- */
.market { background: var(--s1); border-right: 1px solid var(--line); }
.board-tools { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.board-tools .row { display: flex; gap: 6px; align-items: center; min-width: 0; }
.board-tools .row .chiprow { flex: 1; min-width: 0; }
.board-wrap { flex: 1; min-height: 0; overflow: auto; position: relative; }
table.board { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12px; }
table.board th { position: sticky; top: 0; background: var(--s2); color: var(--ink-3); font-weight: 500; font-size: 10.5px; text-align: right; padding: 6px 6px; border-bottom: 1px solid var(--line); z-index: 1; white-space: nowrap; }
table.board th.k { text-align: center; }
table.board td { text-align: right; padding: 0 5px; height: 30px; white-space: nowrap; border-bottom: 1px solid var(--line); color: var(--ink-2); }
table.board td.k { text-align: center; color: var(--ink); font-weight: 600; position: relative; }
table.board tr.atm td { background: var(--accent-fill); }
table.board tr.atm td.k { color: var(--accent-ink); }
table.board tr.hit td { animation: hit .9s ease-out; }
@keyframes hit { from { background: var(--handle-fill); } to { background: transparent; } }
table.board td.q { padding: 0; }
table.board td.q button { width: 100%; height: 30px; border: 0; background: transparent; text-align: right; padding: 0 8px; font: inherit; border-radius: 0; }
table.board td.q button.bid { color: var(--bid); }
table.board td.q button.ask { color: var(--ask); }
table.board td.q button:hover { background: var(--s3); }
table.board td.q button:active { background: var(--handle-fill); }
table.board td.iv, table.board td.d { color: var(--ink-3); font-size: 11.5px; }
table.board .legbadge { position: absolute; left: 2px; top: 50%; transform: translateY(-50%); font-size: 9px; background: var(--handle); color: #fff; border-radius: 3px; padding: 0 3px; line-height: 13px; font-family: var(--font); }
table.board td.k .legbadge.c { left: auto; right: 2px; }
table.board .flag { font-size: 9px; color: var(--warn); margin-left: 2px; }
.board-foot { padding: 6px 12px; font-size: 11px; color: var(--ink-3); border-top: 1px solid var(--line); display: flex; gap: 10px; white-space: nowrap; overflow: hidden; }

.smile-wrap { flex: 1; min-height: 160px; position: relative; touch-action: none; user-select: none; }
.smile-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.smile-wrap .ax text { fill: var(--ink-3); font-size: 10.5px; font-family: var(--mono); }
.smile-wrap .grid line { stroke: var(--line); }
.smile-wrap .curve { fill: none; stroke: var(--accent); stroke-width: 1.75; }
.smile-wrap .curve.ext { stroke-dasharray: 3 3; opacity: .7; }
.smile-wrap .pt { fill: var(--accent); }
.smile-wrap .pt.bid { fill: var(--bid); } .smile-wrap .pt.ask { fill: var(--ask); }
.smile-wrap .pt.x { stroke: var(--warn); fill: none; }
.smile-wrap .atm { stroke: var(--handle); stroke-dasharray: 3 3; }
.smile-wrap .atm2 { stroke: var(--pin2); stroke-dasharray: 2 3; }
.smile-wrap .sel { stroke: var(--ink); stroke-width: 1; }
.smile-wrap .sellbl { fill: var(--ink); font-size: 11px; font-family: var(--mono); font-weight: 600; paint-order: stroke; stroke: var(--s1); stroke-width: 3px; }
.smile-act { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); flex: 0 0 auto; min-height: 48px; }
.smile-act .k { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
.smile-act .hint { color: var(--ink-3); font-size: 12px; }

/* --- bench (positions / metrics) --- */
.bench { background: var(--s1); border-left: 1px solid var(--line); }
.sec { border-bottom: 1px solid var(--line); }
.sec-head { position: sticky; top: 0; z-index: 2; background: var(--s1); display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.sec-head h3 { font-size: 12.5px; font-weight: 600; margin: 0; white-space: nowrap; }
.sec-head .sub { color: var(--ink-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-family: var(--mono); }
.sec-head .spacer { flex: 1; }

.legs { list-style: none; margin: 0; padding: 0; }
.leg { border-bottom: 1px solid var(--line); }
.leg-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; min-height: 48px; }
.leg-main { min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.leg-title { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; min-width: 0; }
.leg-title .side { font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 4px; line-height: 16px; }
.leg-title .side.s { background: var(--loss-fill); color: var(--loss); }
.leg-title .side.b { background: var(--gain-fill); color: var(--gain); }
.leg-title .name { font-family: var(--mono); font-weight: 600; font-size: 14px; }
.leg-title .px { font-family: var(--mono); color: var(--ink-2); font-size: 12.5px; }
.leg-sub { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; font-family: var(--mono); }
.leg-sub .month { color: var(--ink-3); }
.leg .qty { display: inline-grid; grid-template-columns: 26px 30px 26px; height: 30px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--s2); overflow: hidden; }
.leg .qty button { border: 0; background: transparent; color: var(--ink-2); font-size: 14px; }
.leg .qty button:hover { background: var(--s3); color: var(--ink); }
.leg .qty .n { display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 600; font-size: 13px; }
.leg .ops { display: flex; gap: 2px; }
.leg.sel .leg-row { background: var(--handle-fill); }
.leg-detail { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px 10px; padding: 4px 12px 12px; background: var(--s2); font-size: 11.5px; }
.leg-detail .kv .k { color: var(--ink-3); font-size: 10.5px; }
.leg-detail .kv .v { font-family: var(--mono); white-space: nowrap; }
.leg-detail .kv input { width: 100%; height: 28px; }
.leg-detail .flags { grid-column: 1 / -1; color: var(--ink-2); }
.empty-state { padding: 22px 16px; text-align: center; color: var(--ink-3); font-size: 12.5px; display: flex; flex-direction: column; gap: 10px; align-items: center; }

.hedge { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 12px; font-size: 12.5px; }
.hedge .big { font-family: var(--mono); font-weight: 600; }
.hedge .sep { color: var(--ink-3); }

.kv-grid { display: grid; grid-template-columns: 1fr auto; gap: 0; }
.kv-grid > div { padding: 6px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.kv-grid > .k { color: var(--ink-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv-grid > .v { font-family: var(--mono); text-align: right; white-space: nowrap; font-size: 12.5px; }
.kv-grid > .v small { color: var(--ink-3); font-size: 10.5px; }
.metric-tiles { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; padding: 10px 12px; }
.tile { background: var(--s2); border-radius: var(--r-sm); padding: 8px 10px; min-width: 0; }
.tile .k { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-family: var(--mono); font-weight: 600; font-size: 15px; white-space: nowrap; }
.tile .s { font-size: 10.5px; color: var(--ink-3); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

table.tail { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
table.tail th { color: var(--ink-3); font-weight: 500; font-size: 10.5px; text-align: right; padding: 6px 12px 4px; }
table.tail th:first-child { text-align: left; }
table.tail td { text-align: right; padding: 5px 12px; border-top: 1px solid var(--line); white-space: nowrap; }
table.tail td:first-child { text-align: left; color: var(--ink-2); }
table.tail td small { color: var(--ink-3); font-size: 10.5px; display: block; }
table.tail td.loss { color: var(--loss); }
table.tail td.gain { color: var(--gain); }
table.tail td.bar { position: relative; }
table.tail td .barfill { position: absolute; left: 0; top: 6px; bottom: 6px; background: var(--loss-fill); z-index: 0; }
table.tail td .txt { position: relative; z-index: 1; }

.pins { padding: 6px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.pin { display: flex; gap: 8px; align-items: center; white-space: nowrap; min-width: 0; }
.pin .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pin .sw { width: 18px; border-top: 2px dashed; flex: 0 0 auto; }

/* ===== dock (phone / tablet nav) ===== */
.dock { display: none; }
.dock button { flex: 1; border: 0; background: transparent; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10.5px; height: 100%; min-width: 0; }
.dock button .ic { font-size: 18px; line-height: 1; }
.dock button[aria-selected="true"] { color: var(--accent-ink); }
.dock button .cnt { position: absolute; margin-left: 28px; margin-top: -26px; background: var(--handle); color: #fff; border-radius: 999px; font-size: 9px; padding: 0 5px; line-height: 14px; }

/* ===== popovers, sheets, toast, palette ===== */
.menu {
  position: fixed; z-index: 50; min-width: 220px; background: var(--s2); border: 1px solid var(--line-2);
  border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column;
}
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; color: var(--ink); padding: 8px 10px; border-radius: var(--r-sm); text-align: left; white-space: nowrap; }
.menu button:hover { background: var(--s3); }
.menu button .kbd { margin-left: auto; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.menu .mlabel { font-size: 10.5px; color: var(--ink-3); padding: 6px 10px 2px; }
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.35); }

dialog.sheet { border: 0; padding: 0; background: var(--s2); color: var(--ink); border-radius: var(--r); box-shadow: var(--shadow); width: min(520px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); }
dialog.sheet::backdrop { background: rgba(0,0,0,.45); }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font-size: 14px; }
.sheet-body { padding: 12px 16px; overflow: auto; max-height: calc(100dvh - 120px); }
.setrow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.setrow .k { font-size: 13px; }
.setrow .k small { display: block; color: var(--ink-3); font-size: 11px; margin-top: 2px; }
.booklist { display: flex; flex-direction: column; gap: 8px; }
.bookrow { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.bookrow .t { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.bookrow .m { font-size: 11.5px; color: var(--ink-3); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bookrow .ops { display: flex; gap: 4px; flex-wrap: wrap; }

.toasts { position: fixed; left: 50%; bottom: calc(var(--dock-h) + 12px); transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast { background: var(--s4); color: var(--ink); padding: 8px 14px; border-radius: 999px; font-size: 12.5px; box-shadow: var(--shadow); white-space: nowrap; animation: toastin .18s ease-out; }
@keyframes toastin { from { opacity: 0; transform: translateY(6px); } }

.palette { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.4); display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; }
.palette .box { width: min(560px, calc(100vw - 32px)); background: var(--s2); border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.palette input { width: 100%; height: 46px; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 0 16px; font-size: 15px; outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
.palette li { padding: 8px 10px; border-radius: var(--r-sm); display: flex; gap: 10px; align-items: center; cursor: pointer; }
.palette li[aria-selected="true"] { background: var(--s3); }
.palette li .kbd { margin-left: auto; }
.palette li small { color: var(--ink-3); }

.hintbtn { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line-2); background: transparent; color: var(--ink-3); font-size: 11px; padding: 0; line-height: 16px; }
.hintbtn:hover { color: var(--ink); }

/* ===== responsive ===== */
/* PC >= 1200 */
@media (min-width: 1200px) {
  .layout {
    grid-template-columns: minmax(340px, 30%) minmax(0, 1fr) minmax(360px, min(28%, 420px));
    grid-template-rows: minmax(0, 1fr) minmax(0, 1.3fr) auto;
    grid-template-areas:
      "market stage positions"
      "market stage metrics"
      "market scenario metrics";
  }
  .market { grid-area: market; }
  .stage { grid-area: stage; }
  .scenario { grid-area: scenario; }
  section.positions { grid-area: positions; }
  section.metrics { grid-area: metrics; border-top: 1px solid var(--line); }
  .scenario .scn-row { padding-top: 0; }
  .panel.m-sel { display: flex; }
  .dock { display: none; }
  section.smile, section.board { display: none; }
  .layout[data-market="board"] section.board { display: flex; }
  .layout[data-market="smile"] section.smile { display: flex; }
  .market-seg { display: inline-flex; }
  .stage-body { min-height: 300px; }
}
/* tablet 720-1199 */
@media (min-width: 720px) and (max-width: 1199.98px) {
  .layout {
    grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas:
      "stage dock"
      "stage panel"
      "scenario panel";
  }
  .stage { grid-area: stage; }
  .scenario { grid-area: scenario; }
  .dock { grid-area: dock; display: flex; height: 44px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--s1); }
  .dock button .ic { display: none; }
  .dock button { font-size: 12.5px; }
  section.panel.side { grid-area: panel; display: none; border-left: 1px solid var(--line); }
  .layout[data-panel="positions"] section.positions,
  .layout[data-panel="board"] section.board,
  .layout[data-panel="metrics"] section.metrics,
  .layout[data-panel="smile"] section.smile { display: flex; }
  .layout[data-panel="scenario"] section.scenario { display: flex; }
  .scenario { display: flex; }
  .market-seg { display: none; }
  .dock button[data-panel="scenario"] { display: none; }
  .readout .ro.x2 { display: none; }
  .scn-grid { grid-template-columns: repeat(5, minmax(0,1fr)); }
}
/* phone < 720 */
@media (max-width: 719.98px) {
  :root { --top-h: 44px; }
  .top { padding: 0 10px; gap: 8px; }
  .top .brand small { display: none; }
  .top .market-pill { display: none; }
  .top .pill-mini { display: inline-flex; }
  .layout {
    grid-template-rows: minmax(0, 1fr) auto var(--dock-h);
    grid-template-areas: "stage" "sheet" "dock";
    grid-template-columns: minmax(0, 1fr);
  }
  .stage { grid-area: stage; }
  .dock { grid-area: dock; display: flex; border-top: 1px solid var(--line); background: var(--s1); padding-bottom: env(safe-area-inset-bottom); position: relative; }
  section.panel.side, section.scenario { grid-area: sheet; display: none; border-top: 1px solid var(--line-2); border-radius: 14px 14px 0 0; background: var(--s2); position: relative; }
  .layout[data-sheet="hidden"] section.panel.side, .layout[data-sheet="hidden"] section.scenario { display: none !important; }
  .layout[data-panel="positions"] section.positions,
  .layout[data-panel="board"] section.board,
  .layout[data-panel="metrics"] section.metrics,
  .layout[data-panel="smile"] section.smile,
  .layout[data-panel="scenario"] section.scenario { display: flex; }
  .layout[data-sheet="peek"] section.panel.side, .layout[data-sheet="peek"] section.scenario { height: 42dvh; }
  .layout[data-sheet="full"] { grid-template-rows: auto minmax(0, 1fr) var(--dock-h); }
  .layout[data-sheet="full"] .stage-body { min-height: 0; height: 92px; }
  .layout[data-sheet="full"] .timerail, .layout[data-sheet="full"] .stage-head, .layout[data-sheet="full"] .ivrail { display: none; }
  .layout[data-sheet="full"] .stage-body { grid-template-columns: 1fr; }
  .layout[data-sheet="full"] .readout { padding: 4px 12px 6px; }
  .layout[data-sheet="full"] .readout .ro.x1, .layout[data-sheet="full"] .readout .ro.x2 { display: none; }
  .layout[data-sheet="full"] .ro.hero .v { font-size: 20px; }
  .layout[data-sheet="full"] .ro .v { font-size: 15px; }
  .grabber { display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 6px auto 0; cursor: ns-resize; }
  .grabber::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 20px; }
  .panel-head { height: 36px; }
  .readout { gap: 6px; padding: 6px 12px 8px; }
  .readout .ro.x1, .readout .ro.x2 { display: none; }
  .ro.hero .v { font-size: 24px; }
  .ro .v { font-size: 16px; }
  .scn-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .stage-body { grid-template-columns: 1fr 30px; }
  .legend { font-size: 11px; gap: 8px; }
  .legend .lg-pin { display: none; }
  .stage-tools .pc { display: none; }
  .market-seg { display: none; }
  .leg-detail { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .metric-tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .toasts { bottom: calc(var(--dock-h) + 8px); }
  .timerail { margin: 0 10px; }
}
@media (min-width: 720px) {
  .grabber { display: none; }
  .top .pill-mini { display: none; }
}

/* container queries (stage / scenario の幅で決める) */
@container (max-width: 680px) { .readout .ro.x2 { display: none; } }
@container (max-width: 560px) { .readout .ro.x1 { display: none; } .stage-tools .pc.zb { display: none; } }
@container (max-width: 599px) { .scn-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* motion */
@media (prefers-reduced-motion: no-preference) {
  .chart .l-exp, .chart .l-sc, .chart .l-td { transition: d .22s ease-out; }
  .chart.live .l-exp, .chart.live .l-sc, .chart.live .l-td { transition: none; }
  .ro .v { transition: color .2s; }
}

</style>
</head>
<body>
<header class="top">
  <div class="brand">OP Sim<small>試作</small></div>
  <div class="boxtabs" id="boxtabs" role="tablist" aria-label="作業中のポジション"></div>
  <div class="market-pill" id="pill"></div>
  <span class="market-pill pill-mini" id="pill-mini" style="margin-left:auto"></span>
  <button class="btn sm" id="refresh" title="最新の板を読む">最新</button>
  <button class="btn ghost icon" id="theme-btn" title="テーマ">☾</button>
  <button class="btn ghost icon" id="top-more" title="メニュー" aria-haspopup="menu">⋯</button>
</header>

<main class="layout" id="layout" data-panel="positions" data-sheet="peek" data-market="board">

  <!-- ===== stage ===== -->
  <section class="stage panel" id="stage" aria-label="損益グラフ">
    <div class="stage-head">
      <div class="legend" id="legend"></div>
      <div class="stage-tools">
        <span class="seg pc" id="mode-seg"><button data-mode="line" aria-pressed="true">線</button><button data-mode="heat">面</button></span>
        <button class="btn ghost sm pc" id="pin-btn" aria-haspopup="menu">ピン 0/3</button>
        <button class="btn ghost icon sm pc zb" id="zoom-out" title="縮小">−</button>
        <button class="btn ghost icon sm pc zb" id="zoom-in" title="拡大">+</button>
        <button class="btn ghost icon sm pc zb" id="zoom-reset" title="表示をリセット">⟲</button>
        <button class="btn ghost icon sm" id="stage-more" title="グラフの設定" aria-haspopup="menu">⋯</button>
      </div>
    </div>
    <div class="stage-body">
      <div class="chart" id="chart" tabindex="0" aria-label="損益グラフ。横軸 原資産、縦軸 損益。長押しでシナリオ点をつかむ。← → で ΔX、↑ ↓ で Δσ、[ ] で経過日数">
        <canvas id="heat" hidden></canvas>
        <svg xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="ivrail" id="ivrail" aria-label="IV 平行移動 Δσ" role="slider"></div>
    </div>
    <div class="timerail" id="timerail" aria-label="経過日数 d" role="slider"></div>
    <div class="readout" id="readout" aria-label="シナリオ点の値"></div>
  </section>

  <!-- ===== scenario ===== -->
  <section class="scenario panel" id="scenario" aria-label="シナリオ">
    <div class="grabber"></div>
    <div class="scn-grid" id="scn-grid"></div>
    <div class="scn-row"><div class="chiprow" id="scn-presets"></div></div>
    <div class="scn-row"><span class="faint" style="font-size:11px;white-space:nowrap">評価時刻</span><div class="chiprow" id="scn-eval"></div></div>
    <details class="adv">
      <summary>モデルの前提 <span class="vals" id="adv-vals"></span></summary>
      <div class="adv-body">
        <span class="item"><span class="lab">IV の動き方</span><span class="seg" id="adv-sticky"><button data-v="strike">sticky strike</button><button data-v="moneyness">sticky moneyness</button></span></span>
        <span class="item"><span class="lab">先物の basis</span><span class="seg" id="adv-basis"><button data-v="fixed">固定</button><button data-v="decay">減衰</button></span></span>
        <span class="item"><span class="lab">ΔX の単位</span><span class="seg" id="adv-dx"><button data-v="pct">%</button><button data-v="yen">円</button></span></span>
      </div>
    </details>
  </section>

  <!-- ===== positions (bench) ===== -->
  <section class="bench panel side positions" id="positions" aria-label="ポジション">
    <div class="grabber"></div>
    <div class="panel-head"><h2>ポジション</h2><span class="sub" id="pos-sub"></span><span class="spacer"></span><button class="btn ghost icon sm" id="pos-menu" aria-haspopup="menu" title="ポジションの操作">⋯</button></div>
    <div class="panel-body">
      <ul class="legs" id="legs"></ul>
      <div class="sec">
        <div class="sec-head"><h3>デルタヘッジ</h3><span class="sub">先物で目標 Δ に合わせる</span></div>
        <div class="hedge" id="hedge"></div>
      </div>
    </div>
  </section>

  <!-- ===== metrics ===== -->
  <section class="bench panel side metrics" id="metrics" aria-label="指標">
    <div class="grabber"></div>
    <div class="panel-head"><h2>指標 · テール</h2><span class="sub">満期とシナリオ点</span></div>
    <div class="panel-body" id="metrics-body"></div>
  </section>

  <!-- ===== board (market) ===== -->
  <section class="market panel side board" id="board" aria-label="板">
    <div class="grabber"></div>
    <div class="board-tools">
      <div class="row">
        <span class="seg" id="month-seg"><button data-m="2026-11">11月限</button><button data-m="2026-12">12月限</button></span>
        <span class="seg" id="target-seg"><button data-t="put">put</button><button data-t="call">call</button></span>
        <span class="spacer" style="flex:1"></span>
        <span class="seg market-seg" id="market-seg"><button data-mk="board">板</button><button data-mk="smile">スマイル</button></span>
      </div>
      <div class="row">
        <button class="btn sm" data-jump="atm">ATM</button>
        <div class="chiprow">
          <button class="chip" data-jump="otm10">OTM 10%</button><button class="chip" data-jump="otm20">20%</button><button class="chip" data-jump="otm30">30%</button><button class="chip" data-jump="otm40">40%</button>
          <button class="chip" data-jump="delta0.05">|Δ| .05</button><button class="chip" data-jump="delta0.1">.10</button><button class="chip" data-jump="delta0.2">.20</button><button class="chip" data-jump="delta0.3">.30</button>
          <button class="chip warnchip" id="filter-ask" aria-pressed="false">ask ≤ 50 円</button>
        </div>
      </div>
    </div>

/* ===================== market (synthetic, fictional) ===================== */

/* initial fictional positions */

/* ===================== evaluation ===================== */

/* ===================== chart ===================== */

settingsDlg.addEventListener('change', e => { if (e.target.id === 'set-fee') { const v = Number(e.target.value); if (Number.isFinite(v) && v >= 0 && v <= 100000) { state.fee = v; render(); } } });
const bookDlg = $('#book');
function saveToBook() { if (!legs().length) { toast('足が 0 本のタブは保存できない'); return; } state.book.unshift({ id: Date.now(), name: `${legs()[0].month} ${legs().slice(0, 3).map(l => (l.side < 0 ? '売' : '買') + (l.kind === 'opt' ? l.cp + fmt(l.K) : 'ミニ')).join(' ')}`, legs: legs().map(l => ({ ...l })), savedAt: fmtMDHM(new Date()) }); toast('保存一覧に保存した'); }
function openBook() {
  $('#book-body').innerHTML = `<div class="booklist">${state.book.map(b => { const p = premium(b.legs); const st = (() => { const save = tab().legs; tab().legs = b.legs; const r = expiryStats(); tab().legs = save; return r; })(); return `<div class="bookrow" data-id="${b.id}"><div class="t">${b.name}${b.legs === legs() ? '<span class="tag">作業中</span>' : ''}</div><div class="m">${b.legs[0]?.month ?? ''} · 足 ${b.legs.length} 本 · ${p.net >= 0 ? '受取' : '掛け金'} ${amt(Math.abs(p.net >= 0 ? p.net : p.stake), false)} ${unitLabel()} · 最大損失 ${amt(st?.minP ?? 0)} · 保存 ${b.savedAt}</div><div class="ops"><button class="btn sm" data-op="open">開く</button><button class="btn sm" data-op="newtab">新しいタブで開く</button><button class="btn sm" data-op="pin">重ねる</button><button class="btn sm ghost" data-op="del">削除</button></div></div>`; }).join('') || '<div class="empty-state">保存したポジションは無い</div>'}</div>`;
  bookDlg.showModal();
}
bookDlg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.hasAttribute('data-close')) { bookDlg.close(); return; } if (b.id === 'book-save') { saveToBook(); openBook(); return; } const row = b.closest('.bookrow'); const item = state.book.find(x => x.id === Number(row.dataset.id)); const op = b.dataset.op; if (op === 'open') { tab().legs = item.legs.map(l => ({ ...l, id: nextId++ })); state.view = null; bookDlg.close(); render(); toast(`「${item.name}」を開いた（建値は保存時のまま）`); } else if (op === 'newtab') { state.tabs.push(newTab(freeName(), item.legs.map(l => ({ ...l, id: nextId++ })))); state.active = state.tabs.length - 1; state.view = null; bookDlg.close(); render(); } else if (op === 'pin') { bookDlg.close(); addPin({ kind: 'saved', legs: item.legs.map(l => ({ ...l })), name: `保存 ${item.name}`, cond: '今の板・今のシナリオ・今の設定' }); } else if (op === 'del') { state.book = state.book.filter(x => x !== item); openBook(); } });
function openAddLeg() { const v = window.prompt('先物の足: 商品(mini/large/micro) 限月 売買(+1/-1) 枚数 建値 を空白区切り', 'mini 2026-12 1 1 67880'); if (!v) return; const [p, mo, sd, q, px] = v.trim().split(/\s+/); if (!PRODUCTS[p]) return; legs().push(mkFutLeg(p, mo, Number(sd) < 0 ? -1 : 1, Number(px) || FUT.price, Number(q) || 1)); render(); }
function showKeys() { window.alert(['グラフにフォーカスがあるとき:', '← → : ΔX ∓100 円（Shift で 1,000 円）', '↑ ↓ : Δσ ±0.5pt', '[ ] : 経過日数 ±1 日', '0 : シナリオを 0 に', '+ − : 拡大・縮小、R : 表示をリセット', '', '全体: Ctrl/⌘ + K : コマンド、1〜5 : パネル、T : テーマ'].join('\n')); }

/* command palette */
const palEl = $('#palette'); const palInput = $('#palette input'); const palList = $('#palette ul');
function commands() {
  const c = [
    ['シナリオ: 急落 −10% / +20pt / +3', () => { state.scn.dX = Math.round(X0 * -0.1 / 10) * 10; state.scn.dSigma = 20; state.scn.skew = 3; }],
    ['シナリオ: 反発 +5% / −5pt / −1', () => { state.scn.dX = Math.round(X0 * 0.05 / 10) * 10; state.scn.dSigma = -5; state.scn.skew = -1; }],
    ['シナリオ: リセット', () => Object.assign(state.scn, { d: 0, dX: 0, dSigma: 0, skew: 0, beta: 1, sticky: 'strike' })],
    ['評価時刻: 11月限 SQ 9:00', () => { state.scn.d = M['2026-11'].dSq; }],
    ['評価時刻: 11月限 取引最終日 15:45', () => { state.scn.d = M['2026-11'].dLtd; }],
    ['ピン: 今の線を残す', ghostPin],
    ['グラフ: 損益の面（ヒートマップ）に切替', () => { state.mode = state.mode === 'line' ? 'heat' : 'line'; }],
    ['グラフ: 表示をリセット', () => { state.view = null; }],
    ['板: ATM へ', () => { goPanel('board'); setTimeout(() => scrollBoardTo(atmK(M[state.month])), 50); }],
    ['板: put / call を切替', () => { state.target = state.target === 'put' ? 'call' : 'put'; goPanel('board'); }],
    ['タブ: 空のタブを追加', () => { state.tabs.push(newTab(freeName())); state.active = state.tabs.length - 1; state.view = null; }],
    ['保存一覧を開く', openBook], ['設定を開く', openSettings], ['テーマを切替', () => { state.ui.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(); }],
  ];
  const m = M[state.month];
  for (const K of [atmK(m) - 2000, atmK(m) - 1000, atmK(m) + 1000, atmK(m) + 2000]) for (const cp of ['P', 'C']) for (const sd of [-1, 1]) c.push([`足: ${sd < 0 ? '売' : '買'} ${cp} ${fmt(K)} @${fmt(sd < 0 ? m.byK[K][cp].bid : m.byK[K][cp].ask)}（${m.label}）`, () => addFromBoard(m.id, cp, K, sd)]);
  return c;
}
let palItems = [], palSel = 0;
function openPalette() { palEl.hidden = false; palInput.value = ''; renderPalette(); palInput.focus(); }
function closePalette() { palEl.hidden = true; }
function renderPalette() { const q = palInput.value.trim().toLowerCase(); palItems = commands().filter(c => !q || c[0].toLowerCase().includes(q)).slice(0, 12); palSel = clamp(palSel, 0, Math.max(0, palItems.length - 1)); palList.innerHTML = palItems.map((c, i) => `<li aria-selected="${i === palSel}" data-i="${i}">${c[0]}</li>`).join('') || '<li><small>該当なし</small></li>'; }
palInput.addEventListener('input', () => { palSel = 0; renderPalette(); });
palInput.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { palSel = Math.min(palSel + 1, palItems.length - 1); renderPalette(); e.preventDefault(); } else if (e.key === 'ArrowUp') { palSel = Math.max(palSel - 1, 0); renderPalette(); e.preventDefault(); } else if (e.key === 'Enter') { const it = palItems[palSel]; closePalette(); if (it) { it[1](); render(); } } });
palList.addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (!li) return; const it = palItems[Number(li.dataset.i)]; closePalette(); it[1](); render(); });
palEl.addEventListener('click', e => { if (e.target === palEl) closePalette(); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.target.matches('input, textarea, select') || !palEl.hidden) return;
  if (e.key >= '1' && e.key <= '5') { goPanel(['positions', 'board', 'scenario', 'metrics', 'smile'][Number(e.key) - 1]); }
  else if (e.key === 't' || e.key === 'T') { state.ui.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(); render(); }
  else if (e.key === 'g') { chartEl.focus(); }
});

/* theme */
const mq = window.matchMedia('(prefers-color-scheme: light)');
function applyTheme() { const t = state.ui.theme === 'auto' ? (mq.matches ? 'light' : 'dark') : state.ui.theme; document.documentElement.dataset.theme = t; $('#theme-btn').textContent = t === 'dark' ? '☾' : '☀'; }
mq.addEventListener('change', () => { if (state.ui.theme === 'auto') { applyTheme(); render(); } });
try { const h = new URLSearchParams(location.search); if (h.get('theme')) state.ui.theme = h.get('theme'); if (h.get('panel')) state.ui.panel = h.get('panel'); if (h.get('sheet')) state.ui.sheet = h.get('sheet'); if (h.get('mode')) state.mode = h.get('mode'); if (h.get('market')) state.ui.market = h.get('market'); if (h.get('d')) state.scn.d = Number(h.get('d')); if (h.get('dx')) state.scn.dX = Number(h.get('dx')); if (h.get('ds')) state.scn.dSigma = Number(h.get('ds')); } catch { }

/* ===================== render ===================== */
let raf = null;
function render(opt = {}) {
  if (raf) return; raf = requestAnimationFrame(() => {
    raf = null;
    renderChart(); renderRails(); renderReadout();
    if (opt.chartOnly) return;
    renderTop(); renderScenario(); renderPositions(); renderBoard(); renderMetrics(); renderSmile();
  });
}
new ResizeObserver(() => { boardKey = ''; render(); }).observe(chartEl);
new ResizeObserver(() => renderSmile()).observe(smileEl);
window.addEventListener('resize', () => { boardKey = ''; render(); });
applyTheme();
render();
renderBoard(true); renderPositions(true);

</script>
</body>
</html>
